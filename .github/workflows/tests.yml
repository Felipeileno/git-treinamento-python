name: Testes
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pip install -e .
      - run: pytest
      - if: matrix.python-version == '3.14'
        run: mypy
      - run: calculadora soma 2 3

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t calculadora-python .
      - run: docker run --rm calculadora-python soma 2 3
      - run: docker run --rm calculadora-python converter celsius-fahrenheit 100