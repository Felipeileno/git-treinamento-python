[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calculadora-python"
version = "0.1.0"
description = "Calculadora de linha de comando em Python, com CLI, menu interativo e interface gráfica."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Felipe Ileno" }]

[project.urls]
Repository = "https://github.com/Felipeileno/git-treinamento-python"

[project.scripts]
calculadora = "calculadora.cli:main"

[tool.setuptools.packages.find]
include = ["calculadora*"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
files = ["calculadora", "main.py", "interface.py"]